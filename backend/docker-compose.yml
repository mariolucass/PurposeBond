services:
  postgres:
    image: postgres:15
    restart: always
    container_name: social_postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: social_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    container_name: social_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
